apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opensquad-dashboard
  namespace: velya-dev-web
  annotations:
    nginx.ingress.kubernetes.io/service-upstream: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: opensquad.172.19.0.6.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: opensquad-dashboard
                port:
                  number: 80
