apiVersion: v1
kind: ResourceQuota
metadata:
  name: opensquad-web-quota
  namespace: velya-dev-web
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    pods: "15"
    services: "10"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: opensquad-platform-quota
  namespace: velya-dev-platform
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 6Gi
    limits.cpu: "8"
    limits.memory: 12Gi
    pods: "40"
    services: "20"
    persistentvolumeclaims: "5"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: opensquad-agents-quota
  namespace: velya-dev-agents
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 6Gi
    limits.cpu: "8"
    limits.memory: 12Gi
    pods: "20"
    services: "10"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: opensquad-observability-quota
  namespace: velya-dev-observability
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.cpu: "4"
    limits.memory: 8Gi
    pods: "20"
