apiVersion: v1
kind: ResourceQuota
metadata:
  name: web-quota
  namespace: velya-dev-web
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    pods: "15"
    services: "10"
    persistentvolumeclaims: "5"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: core-quota
  namespace: velya-dev-core
spec:
  hard:
    requests.cpu: "6"
    requests.memory: 8Gi
    limits.cpu: "12"
    limits.memory: 16Gi
    pods: "40"
    services: "20"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: platform-quota
  namespace: velya-dev-platform
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    pods: "15"
    services: "10"
