apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: hospitalar-dev-cluster

resources:
  - namespaces.yaml
  - limit-ranges.yaml
  - resource-quotas.yaml
  - network-policies.yaml
  - pod-disruption-budgets.yaml
  - ../../bootstrap/priority-classes.yaml
  - ../../services/velya-dev-web/velya-web.yaml
  - ../../apps/velya-web-ingress.yaml
  - ../../services/velya-dev-core/patient-flow.yaml
  - ../../services/velya-dev-core/discharge-orchestrator.yaml
  - ../../services/velya-dev-core/task-inbox.yaml
  - ../../services/velya-dev-core/audit-service.yaml
  - ../../services/velya-dev-platform/decision-log-service.yaml

patches:
  - target:
      kind: Deployment
      namespace: velya-dev-web
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ignored
      spec:
        template:
          metadata:
            labels:
              velya.io/cluster-role: hospitalar
          spec:
            nodeSelector:
              velya.io/tier: frontend
  - target:
      kind: Deployment
      namespace: velya-dev-core
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ignored
      spec:
        template:
          metadata:
            labels:
              velya.io/cluster-role: hospitalar
          spec:
            nodeSelector:
              velya.io/tier: backend
  - target:
      kind: Deployment
      namespace: velya-dev-platform
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ignored
      spec:
        template:
          metadata:
            labels:
              velya.io/cluster-role: hospitalar
          spec:
            nodeSelector:
              velya.io/tier: backend
